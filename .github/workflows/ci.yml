# =============================================================================
# CI do Norte (Node 22 + TypeScript + Fastify + SQLite, ver docs/ARCHITECTURE.md).
#
# Bootstrap: o código de aplicação nasce na FEAT-001 — até lá o repo é só
# documentação e não existe package.json. Os steps que dependem de package.json
# são condicionados à existência dele (hashFiles('package.json') != ''), com um
# aviso no lugar, para que PRs de docs passem com CI verde desde já. Essas
# condições de bootstrap saem assim que a FEAT-001 mergear o scaffold.
#
# Gates obrigatórios do processo (docs/process/DEVELOPMENT_PROCESS.md):
# lint, typecheck, testes com cobertura, build e scan de segurança.
# PR só entra em main com todos verdes.
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Token de CI só lê — nenhum step precisa de escrita, e action de terceiro
# comprometida não deve conseguir alterar nada. pull-requests: read é o mínimo
# que ferramentas de secret scanning costumam exigir para listar os commits
# do PR; se a sua não precisar, remova.
permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar existência do scaffold (FEAT-001)
        id: scaffold
        run: |
          if [ -f package.json ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup do Node
        if: steps.scaffold.outputs.existe == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        if: steps.scaffold.outputs.existe == 'true'
        run: npm ci

      - name: Lint
        if: steps.scaffold.outputs.existe == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.scaffold.outputs.existe == 'true'
        run: npx tsc --noEmit

      - name: Testes (com cobertura)
        if: steps.scaffold.outputs.existe == 'true'
        run: npm test

      - name: Build
        if: steps.scaffold.outputs.existe == 'true'
        run: npm run build

      - name: Aguardando scaffold da FEAT-001
        if: steps.scaffold.outputs.existe == 'false'
        run: echo "Sem package.json ainda — repo só com documentação. Lint/typecheck/testes/build entram quando a FEAT-001 criar o scaffold."

  security:
    name: Gates de segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O scan de secrets varre o histórico completo, não só o diff
          fetch-depth: 0

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar existência do scaffold (FEAT-001)
        id: scaffold
        run: |
          if [ -f package.json ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auditoria de dependências
        if: steps.scaffold.outputs.existe == 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: Aguardando scaffold da FEAT-001
        if: steps.scaffold.outputs.existe == 'false'
        run: echo "Sem package.json ainda — repo só com documentação. Auditoria de dependências entra quando a FEAT-001 criar o scaffold."
