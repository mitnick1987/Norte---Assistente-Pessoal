# =============================================================================
# CI do Norte (Node 22 + TypeScript + Fastify + SQLite, ver docs/ARCHITECTURE.md).
#
# Gates obrigatórios do processo (docs/process/DEVELOPMENT_PROCESS.md):
# lint, typecheck, testes com cobertura, build e scan de segurança.
# PR só entra em main com todos verdes.
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Token de CI só lê — nenhum step precisa de escrita, e action de terceiro
# comprometida não deve conseguir alterar nada. pull-requests: read é o mínimo
# que ferramentas de secret scanning costumam exigir para listar os commits
# do PR; se a sua não precisar, remova.
permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup do Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testes (com cobertura)
        run: npm test

      - name: Build
        run: npm run build

  security:
    name: Gates de segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O scan de secrets varre o histórico completo, não só o diff
          fetch-depth: 0

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup do Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high
